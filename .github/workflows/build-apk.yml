name: Build APK

on:
  push:
    branches: [ main, arena/* ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$ANDROID_HOME/tools/bin/sdkmanager"; fi
          echo "sdkmanager: $SDKMGR"
          yes | $SDKMGR --licenses >/dev/null 2>&1 || true
          $SDKMGR "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          echo "=== APK FILES ==="
          find . -name "*.apk" -type f
          APK=$(find . -name "*.apk" -type f | head -1)
          echo "APK=$APK"
          cp "$APK" retrobit-emulator.apk
          ls -la retrobit-emulator.apk
          echo "=== TAIL ==="
          tail -30 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: retrobit-emulator-debug-apk
          path: retrobit-emulator.apk

      - name: Create GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-debug
          name: RetroBit Emulator (debug APK)
          files: retrobit-emulator.apk
          prerelease: true
